name: Auditar catálogo público Odilo no navegador
on:
  push:
    paths:
      - 'scripts/audit_odilo_browser.mjs'
      - '.github/workflows/audit-odilo-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit_odilo_browser.mjs
