name: Publicar Biblioteca Joaquim no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: biblioteca-joaquim-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Rodar testes
        run: npm test
      - name: Compilar para o endereço do GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Conferir HTML e JavaScript publicados no site real
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://luan-henrique-21-29.github.io/biblioteca-escola/"
          for attempt in $(seq 1 10); do
            echo "Tentativa $attempt: verificando $SITE"
            if curl -fsSL "$SITE?verify=$GITHUB_SHA" -o /tmp/joaquim-site.html; then
              ASSET=$(grep -oE 'src="/biblioteca-escola/assets/[^"]+\.js"' /tmp/joaquim-site.html | head -n 1 | cut -d'"' -f2 || true)
              echo "Arquivo JavaScript detectado: $ASSET"
              if [[ -n "$ASSET" ]] && curl -fsSL "https://luan-henrique-21-29.github.io$ASSET" -o /tmp/joaquim-main.js; then
                echo "Site publicado e JavaScript acessível com sucesso."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::O site publicado não está entregando o JavaScript. Verifique Settings > Pages > Source: GitHub Actions."
          head -c 1000 /tmp/joaquim-site.html || true
          exit 1
